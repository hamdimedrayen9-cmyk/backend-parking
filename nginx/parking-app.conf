server {
    listen 80;
    server_name localhost;

    # Root of the application (proxying everything to Spring Boot)
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Extra protection for the superadmin dashboard
    location /superadmin {
        auth_basic "Zone d'accès restreint - SuperAdmin";
        auth_basic_user_file C:/nginx/conf/.htpasswd; # Chemin vers votre fichier .htpasswd

        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sécurité supplémentaire
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # Optionnel : Protection des statics (facultatif si Spring s'en occupe bien)
    location /css/ {
        proxy_pass http://127.0.0.1:8087/css/;
    }
    location /js/ {
        proxy_pass http://127.0.0.1:8087/js/;
    }
}
