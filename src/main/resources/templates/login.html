<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – ParkManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">
                    <img th:src="@{/images/parking.png}" alt="Logo" style="width: 50px; height: 50px;">
                </div>
                <h1>ParkManager</h1>
                <p>Connectez-vous à votre compte</p>
            </div>

            <div th:if="${param.error != null or error != null}" class="alert alert-danger" id="errorAlert">
                <span id="errorText" th:text="${error != null ? error : (session.error != null ? session.error : 'Email ou mot de passe incorrect.')}">Email ou mot de passe incorrect.</span>
            </div>
            <div th:if="${param.logout != null}" class="alert alert-success">
                <img th:src="@{/images/success.webp}" alt="Success" class="alert-icon" style="width: 20px; height: 20px;">
                <div class="alert-content">Vous avez été déconnecté avec succès.</div>
            </div>
            <div th:if="${success}" class="alert alert-success">
                <img th:src="@{/images/success.webp}" alt="Success" class="alert-icon" style="width: 20px; height: 20px;">
                <div class="alert-content" th:text="${success}">Compte créé avec succès !</div>
            </div>

            <form th:action="@{/login}" method="post" id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="emailInput">Adresse email</label>
                    <div class="input-group">
                        <input type="email" name="username" class="form-control" 
                               placeholder="votre@email.com" required autofocus 
                               id="emailInput" autocomplete="email">
                        <span class="input-icon"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="passwordInput">Mot de passe</label>
                    <div class="input-group input-password">
                        <input type="password" name="password" class="form-control" 
                               placeholder="••••••••" required 
                               id="passwordInput" autocomplete="current-password">
                        <span class="input-icon"></span>
                        <button type="button" class="password-toggle" 
                                onclick="togglePassword()" aria-label="Afficher le mot de passe"></button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-submit w-full" id="submitBtn">
                    <span class="btn-text">
                        <img th:src="@{/images/connexion.png}" alt="Login" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;">
                        Se connecter
                    </span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="auth-footer">
                <p>Pas encore de compte ? <a th:href="@{/register}">Créer un compte</a></p>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function togglePassword() {
        var passwordInput = document.getElementById('passwordInput');
        var toggleBtn = document.querySelector('.password-toggle');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.style.backgroundImage = 'url("/images/hidden.png")';
        } else {
            passwordInput.type = 'password';
            toggleBtn.style.backgroundImage = 'url("/images/eye.png")';
        }
    }

    // Form submission loading state
    document.getElementById('loginForm').addEventListener('submit', function() {
        var submitBtn = document.getElementById('submitBtn');
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
    });

    // Lockout handling
    var errorMsg = /*[[${session.error}]]*/ '';
    var isLocked = errorMsg && errorMsg.includes('temporairement bloqué');

    if (isLocked) {
        document.getElementById('loginForm').classList.add('login-locked');

        var match = errorMsg.match(/(\d+) secondes/);
        if (match) {
            var seconds = parseInt(match[1]);

            var timer = setInterval(function() {
                seconds = seconds - 1;
                if (seconds > 0) {
                    var errorText = document.getElementById('errorText');
                    if (errorText) {
                        errorText.textContent = '🔒 Compte temporairement bloqué. Réessayez dans ' + seconds + ' secondes.';
                    }
                } else {
                    clearInterval(timer);
                    document.getElementById('loginForm').classList.remove('login-locked');
                    document.getElementById('errorAlert').style.display = 'none';
                }
            }, 1000);
        }
    }
</script>
</body>
</html>
