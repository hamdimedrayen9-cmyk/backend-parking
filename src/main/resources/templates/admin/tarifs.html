<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Tarifs – ParkManager</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-icon">🅿️</div>
            <div><h2 th:text="${parking.nom}">Parking</h2><small>Administration</small></div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}"><span class="nav-icon">📊</span> Tableau de bord</a>
            <a th:href="@{/admin/places}"><span class="nav-icon">🔲</span> Places</a>
            <a th:href="@{/admin/tarifs}" class="active"><span class="nav-icon">💰</span> Tarifs</a>
            <a th:href="@{/admin/reservations}"><span class="nav-icon">📋</span> Réservations</a>
            <a th:href="@{/admin/statistiques}"><span class="nav-icon">📈</span> Statistiques</a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                Déconnexion
            </a>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar">
            <h1>💰 Gestion des Tarifs</h1>
            <button onclick="document.getElementById('modalTarif').classList.add('active')" class="btn btn-primary">
                <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                Ajouter tarif
            </button>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>#</th><th>Type de véhicule</th><th>Prix / heure</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="t : ${tarifs}">
                                <td class="text-muted" th:text="${t.id}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${t.typeVehicule == 'VOITURE' ? 'badge-info' :
                                                           t.typeVehicule == 'MOTO' ? 'badge-warning' :
                                                           t.typeVehicule == 'CAMION' ? 'badge-danger' : 'badge-success'}"
                                          th:text="${t.typeVehicule}"></span>
                                </td>
                                <td><strong th:text="${#numbers.formatDecimal(t.prixHeure,1,2) + ' DT/h'}"></strong></td>
                                <td>
                                    <a th:href="@{/admin/tarifs/supprimer/{id}(id=${t.id})}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('Supprimer ce tarif ?')">
                                        <img th:src="@{/images/supprimer.png}" alt="🗑️" style="width: 14px; height: 14px; filter: brightness(0) invert(1);">
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tarifs)}">
                                <td colspan="4"><div class="empty-state"><div class="empty-icon">💰</div>Aucun tarif défini</div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modalTarif">
    <div class="modal">
        <div class="modal-header">
            <h3>💰 Ajouter un tarif</h3>
            <button class="modal-close" onclick="document.getElementById('modalTarif').classList.remove('active')">×</button>
        </div>
        <form th:action="@{/admin/tarifs/ajouter}" method="post">
            <div class="form-group">
                <label class="form-label">Type de véhicule *</label>
                <select name="typeVehicule" class="form-control" required>
                    <option value="VOITURE">Voiture</option>
                    <option value="MOTO">Moto</option>
                    <option value="CAMION">Camion</option>
                    <option value="VAN">Van</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Prix par heure (DT) *</label>
                <input type="number" name="prixHeure" class="form-control" step="0.5" min="0.5" placeholder="Ex: 3.5" required>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                    Ajouter
                </button>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalTarif').classList.remove('active')">Annuler</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
