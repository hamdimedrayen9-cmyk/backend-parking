<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Places – ParkManager</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-icon">🅿️</div>
            <div><h2 th:text="${parking.nom}">Parking</h2><small>Administration</small></div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}"><span class="nav-icon">📊</span> Tableau de bord</a>
            <a th:href="@{/admin/places}" class="active"><span class="nav-icon">🔲</span> Places</a>
            <a th:href="@{/admin/tarifs}"><span class="nav-icon">💰</span> Tarifs</a>
            <a th:href="@{/admin/reservations}"><span class="nav-icon">📋</span> Réservations</a>
            <a th:href="@{/admin/statistiques}"><span class="nav-icon">📈</span> Statistiques</a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                Déconnexion
            </a>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar">
            <h1>🔲 Gestion des Places</h1>
            <button onclick="document.getElementById('modalPlace').classList.add('active')" class="btn btn-primary">
                <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                Ajouter une place
            </button>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>#</th><th>Numéro</th><th>Type</th><th>Disponibilité</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="p : ${places}">
                                <td class="text-muted" th:text="${p.id}"></td>
                                <td><strong th:text="${'Place ' + p.numero}"></strong></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${p.type == 'STANDARD' ? 'badge-info' :
                                                           p.type == 'VIP' ? 'badge-success' :
                                                           p.type == 'HANDICAPE' ? 'badge-purple' : 'badge-warning'}"
                                          th:text="${p.type}"></span>
                                </td>
                                <td>
                                    <span th:if="${p.disponible}" class="badge badge-success">✅ Disponible</span>
                                    <span th:unless="${p.disponible}" class="badge badge-danger">🔴 Occupée</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/places/supprimer/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('Supprimer ?')">
                                        <img th:src="@{/images/supprimer.png}" alt="🗑️" style="width: 14px; height: 14px; filter: brightness(0) invert(1);">
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(places)}">
                                <td colspan="5"><div class="empty-state"><div class="empty-icon">🔲</div>Aucune place configurée</div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modalPlace">
    <div class="modal">
        <div class="modal-header">
            <h3>🔲 Ajouter une place</h3>
            <button class="modal-close" onclick="document.getElementById('modalPlace').classList.remove('active')">×</button>
        </div>
        <form th:action="@{/admin/places/ajouter}" method="post">
            <div class="form-group">
                <label class="form-label">Numéro de place *</label>
                <input type="number" name="numero" class="form-control" min="1" required>
            </div>
            <div class="form-group">
                <label class="form-label">Type *</label>
                <select name="type" class="form-control" required>
                    <option value="STANDARD">Standard</option>
                    <option value="VIP">VIP</option>
                    <option value="HANDICAPE">Handicapé</option>
                    <option value="MOTO">Moto</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                    Ajouter
                </button>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalPlace').classList.remove('active')">Annuler</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
