<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Clients – ParkManager</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-icon">🅿️</div>
            <div><h2>ParkManager</h2><small>Super Administration</small></div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/superadmin/dashboard}"><span class="nav-icon">📊</span> Tableau de bord</a>
            <a th:href="@{/superadmin/carte}">
                <span class="nav-icon">
                    <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Voir la carte
            </a>
            <a th:href="@{/superadmin/parkings}"><span class="nav-icon">🏢</span> Parkings</a>
            <a th:href="@{/superadmin/admins}"><span class="nav-icon">👤</span> Administrateurs</a>
            <a th:href="@{/superadmin/clients}" class="active"><span class="nav-icon">👥</span> Clients</a>
            <a th:href="@{/superadmin/statistiques}"><span class="nav-icon">📈</span> Statistiques</a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                Déconnexion
            </a>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar"><h1>👥 Clients enregistrés</h1></div>
        <div class="page-body">
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>#</th><th>Nom</th><th>Email</th><th>Véhicules</th><th>Réservations</th></tr></thead>
                        <tbody>
                            <tr th:each="c : ${clients}">
                                <td class="text-muted" th:text="${c.id}"></td>
                                <td><strong th:text="${c.nom}"></strong></td>
                                <td th:text="${c.email}"></td>
                                <td><span class="badge badge-info" th:text="${c.vehicules != null ? c.vehicules.size() : 0}"></span></td>
                                <td><span class="badge badge-purple" th:text="${c.reservations != null ? c.reservations.size() : 0}"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clients)}">
                                <td colspan="5"><div class="empty-state"><div class="empty-icon">👥</div>Aucun client</div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
