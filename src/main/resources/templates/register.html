<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription – ParkManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">
                    <img th:src="@{/images/parking.png}" alt="Logo" style="width: 50px; height: 50px;">
                </div>
                <h1>Créer un compte</h1>
                <p>Rejoignez ParkManager</p>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <div class="alert-content" th:text="${error}">Erreur d'inscription</div>
            </div>

            <form th:action="@{/register}" method="post" id="registerForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="nomInput">Nom complet</label>
                    <div class="input-group">
                        <input type="text" name="nom" class="form-control" 
                               placeholder="Jean Dupont" required autofocus 
                               id="nomInput" autocomplete="name">
                        <span class="input-icon icon-user"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="emailInput">Adresse email</label>
                    <div class="input-group">
                        <input type="email" name="email" class="form-control" 
                               placeholder="jean@exemple.com" required 
                               id="emailInput" autocomplete="email">
                        <span class="input-icon icon-email"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="passwordInput">Mot de passe</label>
                    <div class="input-group">
                        <input type="password" name="motDePasse" class="form-control" 
                               placeholder="••••••••" required minlength="6"
                               id="passwordInput" autocomplete="new-password">
                        <span class="input-icon icon-password"></span>
                        <button type="button" class="password-toggle" 
                                onclick="togglePassword()" aria-label="Afficher le mot de passe"></button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-submit w-full" id="submitBtn">
                    <span class="btn-text">
                        <img th:src="@{/images/connexion.png}" alt="Icon" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;">
                        Créer mon compte
                    </span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="auth-footer">
                <p>Déjà inscrit ? <a th:href="@{/login}">Se connecter</a></p>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function togglePassword() {
        var passwordInput = document.getElementById('passwordInput');
        var toggleBtn = document.querySelector('.password-toggle');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.style.backgroundImage = 'url("/images/hidden.png")';
        } else {
            passwordInput.type = 'password';
            toggleBtn.style.backgroundImage = 'url("/images/eye.png")';
        }
    }

    // Form submission loading state
    document.getElementById('registerForm').addEventListener('submit', function() {
        var submitBtn = document.getElementById('submitBtn');
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
    });
</script>
</body>
</html>
