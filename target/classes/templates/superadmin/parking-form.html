<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Parking – ParkManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #map-selector {
            height: 350px;
            width: 100%;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            z-index: 1;
        }
        .form-grid-coords {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .map-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🅿️</div>
            <div><h2>ParkManager</h2><small>Super Administration</small></div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/superadmin/dashboard}"><span class="nav-icon">📊</span> Tableau de bord</a>
            <a th:href="@{/superadmin/carte}">
                <span class="nav-icon">
                    <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Voir la carte
            </a>
            <a th:href="@{/superadmin/parkings}" class="active"><span class="nav-icon">🏢</span> Parkings</a>
            <a th:href="@{/superadmin/admins}"><span class="nav-icon">👤</span> Administrateurs</a>
            <a th:href="@{/superadmin/clients}"><span class="nav-icon">👥</span> Clients</a>
            <a th:href="@{/superadmin/statistiques}"><span class="nav-icon">📈</span> Statistiques</a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                Déconnexion
            </a>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar">
            <h1 th:if="${parking.id != null}">✏️ Modifier le parking</h1>
            <h1 th:if="${parking.id == null}">
                <img th:src="@{/images/ajouter.png}" alt="+" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 8px;">
                Nouveau parking
            </h1>
            <a th:href="@{/superadmin/parkings}" class="btn btn-secondary">← Retour</a>
        </div>
        <div class="page-body">
            <div class="card" style="max-width:600px;">
                <div class="card-header"><h3>Informations du parking</h3></div>
                <div class="card-body">
                    <form th:action="@{/superadmin/parkings/sauvegarder}" method="post">
                        <input type="hidden" th:name="id" th:value="${parking.id}">
                        <div class="form-group">
                            <label class="form-label">Nom du parking *</label>
                            <input type="text" name="nom" class="form-control" th:value="${parking.nom}" placeholder="Ex: Parking Central" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Adresse *</label>
                            <input type="text" name="adresse" class="form-control" th:value="${parking.adresse}" placeholder="Ex: 12 Rue de la Paix, Tunis" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Capacité totale (places) *</label>
                            <input type="number" name="capacite" class="form-control" th:value="${parking.capacite}" min="1" placeholder="Ex: 100" required>
                        </div>

                        <div class="form-group" style="margin-top: 1.5rem;">
                            <label class="form-label">
                                <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;">
                                Localisation géographique
                            </label>
                            <div class="map-hint">
                                <span>👆 Cliquez sur la carte pour définir la position exacte</span>
                            </div>
                            <div id="map-selector"></div>
                            
                            <div class="form-grid-coords">
                                <div class="form-group">
                                    <label class="form-label">Latitude</label>
                                    <input type="number" step="any" name="latitude" id="lat-input" class="form-control" th:value="${parking.latitude}" placeholder="Ex: 36.8065">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Longitude</label>
                                    <input type="number" step="any" name="longitude" id="lng-input" class="form-control" th:value="${parking.longitude}" placeholder="Ex: 10.1815">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Assigner un administrateur</label>
                            <select name="adminId" class="form-control">
                                <option value="">-- Aucun --</option>
                                <option th:each="admin : ${admins}"
                                        th:value="${admin.id}"
                                        th:text="${admin.nom + ' (' + admin.email + ')'}"
                                        th:selected="${parking.adminParking != null && parking.adminParking.id == admin.id}">
                                </option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="btn btn-primary">💾 Sauvegarder</button>
                            <a th:href="@{/superadmin/parkings}" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const latInput = document.getElementById('lat-input');
        const lngInput = document.getElementById('lng-input');
        
        // Coordonnées initiales (Parking existant ou Tunis par défaut)
        let initialLat = parseFloat(latInput.value) || 36.8065;
        let initialLng = parseFloat(lngInput.value) || 10.1815;
        
        const map = L.map('map-selector').setView([initialLat, initialLng], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        let marker;
        
        // Si on a déjà des coordonnées, placer le marqueur
        if (latInput.value && lngInput.value) {
            marker = L.marker([initialLat, initialLng], {draggable: true}).addTo(map);
            setupMarkerListeners(marker);
        }
        
        // Cliquer sur la carte pour placer/déplacer le marqueur
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng, {draggable: true}).addTo(map);
                setupMarkerListeners(marker);
            }
            
            updateInputs(lat, lng);
        });
        
        function setupMarkerListeners(m) {
            m.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                updateInputs(pos.lat, pos.lng);
            });
        }
        
        function updateInputs(lat, lng) {
            latInput.value = lat.toFixed(6);
            lngInput.value = lng.toFixed(6);
        }

        // Permettre la mise à jour manuelle des inputs pour déplacer le marqueur
        [latInput, lngInput].forEach(input => {
            input.addEventListener('change', () => {
                const lat = parseFloat(latInput.value);
                const lng = parseFloat(lngInput.value);
                if (!isNaN(lat) && !isNaN(lng)) {
                    const newLatLng = new L.LatLng(lat, lng);
                    if (marker) {
                        marker.setLatLng(newLatLng);
                    } else {
                        marker = L.marker(newLatLng, {draggable: true}).addTo(map);
                        setupMarkerListeners(marker);
                    }
                    map.panTo(newLatLng);
                }
            });
        });
    });
</script>
</body>
</html>
