<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrateurs – ParkManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-icon">🅿️</div>
            <div><h2>ParkManager</h2><small>Super Administration</small></div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/superadmin/dashboard}"><span class="nav-icon">📊</span> Tableau de bord</a>
            <a th:href="@{/superadmin/carte}">
                <span class="nav-icon">
                    <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Voir la carte
            </a>
            <a th:href="@{/superadmin/parkings}"><span class="nav-icon">🏢</span> Parkings</a>
            <a th:href="@{/superadmin/admins}" class="active"><span class="nav-icon">👤</span> Administrateurs</a>
            <a th:href="@{/superadmin/clients}"><span class="nav-icon">👥</span> Clients</a>
            <a th:href="@{/superadmin/statistiques}"><span class="nav-icon">📈</span> Statistiques</a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                Déconnexion
            </a>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar">
            <h1>👤 Administrateurs de Parking</h1>
            <button onclick="document.getElementById('modalAdmin').classList.add('active')" class="btn btn-primary">
                <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                Nouvel admin
            </button>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>#</th><th>Nom</th><th>Email</th><th>Parking assigné</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="a : ${admins}">
                                <td class="text-muted" th:text="${a.id}"></td>
                                <td><strong th:text="${a.nom}"></strong></td>
                                <td th:text="${a.email}"></td>
                                <td>
                                    <span th:if="${a.parking != null}" class="badge badge-success" th:text="${a.parking.nom}"></span>
                                    <span th:unless="${a.parking != null}" class="badge badge-secondary">Non assigné</span>
                                </td>
                                <td>
                                    <a th:href="@{/superadmin/admins/supprimer/{id}(id=${a.id})}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('Supprimer cet admin ?')">
                                        <img th:src="@{/images/supprimer.png}" alt="🗑️" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 5px; filter: brightness(0) invert(1);">
                                        Supprimer
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(admins)}">
                                <td colspan="5"><div class="empty-state"><div class="empty-icon">👤</div>Aucun administrateur</div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL CRÉER ADMIN -->
<div class="modal-overlay" id="modalAdmin">
    <div class="modal">
        <div class="modal-header">
            <h3>👤 Créer un administrateur</h3>
            <button class="modal-close" onclick="document.getElementById('modalAdmin').classList.remove('active')">×</button>
        </div>
        <form th:action="@{/superadmin/admins/creer}" method="post">
            <div class="form-group">
                <label class="form-label">Nom complet *</label>
                <input type="text" name="nom" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe *</label>
                <input type="password" name="motDePasse" class="form-control" minlength="6" required>
            </div>
            <div class="form-group">
                <label class="form-label">Assigner au parking</label>
                <select name="parkingId" class="form-control">
                    <option value="">-- Aucun --</option>
                    <option th:each="p : ${parkings}" th:value="${p.id}" th:text="${p.nom}"></option>
                </select>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                    Créer
                </button>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalAdmin').classList.remove('active')">Annuler</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
