<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<div th:fragment="placesFragment">
    <div th:if="${places != null and not #lists.isEmpty(places)}">
        <p class="text-muted mb-4" th:text="${places.size() + ' place(s) disponible(s) dans ce parking'}"></p>
        <div class="place-grid">
            <div th:each="p : ${places}"
                 class="place-card"
                 th:data-id="${p.id}"
                 th:data-num="${p.numero}"
                 th:data-type="${p.type}"
                 th:onclick="'selectPlace(' + p.id + ',' + p.numero + ',\'' + p.type + '\')'">
                <div class="place-num" th:text="${p.numero}">1</div>
                <div class="place-type" th:text="${p.type}">STANDARD</div>
                <div style="margin-top:0.5rem;">
                    <span class="badge badge-success" style="font-size:0.65rem;">✅ Libre</span>
                </div>
            </div>
        </div>
        <div th:if="${tarifs != null}" style="margin-top:1rem;">
            <strong>Tarifs :</strong>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;">
                <span th:each="t : ${tarifs}" class="tarif-tag">
                    <img th:src="@{/images/auto.png}" alt="Car" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;">
                    <span th:text="${t.typeVehicule}"></span> :
                    <strong th:text="${#numbers.formatDecimal(t.prixHeure,1,2) + ' DT/h'}"></strong>
                </span>
            </div>
        </div>
    </div>
    <div th:if="${places == null or #lists.isEmpty(places)}"
         class="empty-state">
        <div class="empty-icon">😔</div>
        <p>Aucune place disponible dans ce parking</p>
    </div>
</div>
</body>
</html>
