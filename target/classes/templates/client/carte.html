<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des Parkings – ParkManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            z-index: 1;
        }
        .parking-popup {
            padding: 5px;
        }
        .parking-popup h3 {
            margin: 0 0 5px 0;
            color: var(--primary);
        }
        .parking-popup p {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
        }
        .availability-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .avail-high { background: #dcfce7; color: #166534; }
        .avail-low { background: #fef3c7; color: #92400e; }
        .avail-none { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <img th:src="@{/images/parking.png}" alt="Logo" style="width: 32px; height: 32px;">
                </div>
                <div>
                    <h2>ParkManager</h2>
                    <small>Espace Client</small>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a th:href="@{/client/dashboard}">
                    <span class="nav-icon">
                        <img th:src="@{/images/accueil.png}" alt="Accueil" style="width: 18px; height: 18px; vertical-align: middle;">
                    </span> 
                    Accueil
                </a>
                <a th:href="@{/client/carte}" class="active">
                    <span class="nav-icon">
                        <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 18px; height: 18px; vertical-align: middle;">
                    </span> 
                    Carte des parkings
                </a>
                <a th:href="@{/client/reserver}">
                    <span class="nav-icon">
                        <img th:src="@{/images/ajouter.png}" alt="Ajouter" style="width: 18px; height: 18px; vertical-align: middle;">
                    </span> 
                    Réserver une place
                </a>
                <a th:href="@{/client/reservations}">
                    <span class="nav-icon">
                        <img th:src="@{/images/programme.png}" alt="Reservations" style="width: 18px; height: 18px; vertical-align: middle;">
                    </span> 
                    Mes réservations
                </a>
                <a th:href="@{/client/vehicules}">
                    <span class="nav-icon">
                        <img th:src="@{/images/auto.png}" alt="Vehicules" style="width: 18px; height: 18px; vertical-align: middle;">
                    </span> 
                    Mes véhicules
                </a>
                <a th:href="@{/client/ai}" style="background:rgba(99,102,241,.12);border-left:3px solid #6366f1;">
                    <span class="nav-icon">🤖</span>
                    IA Recommandation
                </a>
            </nav>
            <div class="sidebar-footer">
                <a th:href="@{/logout}">
                    <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                    Déconnexion
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>
                    <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 8px;">
                    Localisation des Parkings
                </h1>
            </div>

            <div class="page-body">
                <div class="card">
                    <div id="map"></div>
                </div>
                
                <div class="card" style="margin-top: 2rem;">
                    <div class="card-header">
                        <h3>🏢 Liste des parkings</h3>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nom</th>
                                    <th>Adresse</th>
                                    <th>Places libres</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${parkingJson}">
                                    <td th:text="${p.nom}">Parking</td>
                                    <td th:text="${p.adresse}">Adresse</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${p.disponibles > 10 ? 'badge-success' : (p.disponibles > 0 ? 'badge-warning' : 'badge-danger')}"
                                              th:text="${p.disponibles + ' places'}">
                                        </span>
                                    </td>
                                    <td>
                                        <button class="btn btn-primary w-full" th:onclick="'focusParking(' + ${p.id} + ')'">
                                            <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px; filter: brightness(0) invert(1);">
                                            Voir sur carte
                                        </button>
                                        <a th:href="@{/client/reserver(parkingId=${p.id})}" class="btn btn-primary btn-sm">Réserver</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script th:inline="javascript">
        /* Data from Thymeleaf */
        const parkings = /*[[${parkingJson}]]*/ [];
        let map;

        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser la carte centrée sur une position par défaut (Tunis)
            map = L.map('map').setView([36.8065, 10.1815], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            const markers = [];

            // Ajouter les marqueurs pour chaque parking
            parkings.forEach(p => {
                if (p.latitude && p.longitude) {
                    const count = p.disponibles || 0;
                    const badgeClass = count > 10 ? 'avail-high' : (count > 0 ? 'avail-low' : 'avail-none');
                    
                    const popupContent = `
                        <div class="parking-popup">
                            <h3 style="margin:0; color:#2563eb;">${p.nom}</h3>
                            <p style="margin:5px 0; color:#64748b;">${p.adresse}</p>
                            <div class="availability-badge ${badgeClass}" style="margin-bottom:10px;">
                                ${count} places disponibles
                            </div>
                            <div>
                                <a href="/client/reserver?parkingId=${p.id}" 
                                   style="background:#2563eb; color:white; text-decoration:none; display:inline-block; padding:6px 12px; border-radius:6px; font-size:0.85rem; font-weight:600;">
                                   Réserver ici
                                </a>
                            </div>
                        </div>
                    `;

                    const marker = L.marker([p.latitude, p.longitude]).addTo(map)
                        .bindPopup(popupContent);
                    
                    markers.push(marker);
                }
            });

            // Ajuster la vue pour inclure tous les marqueurs s'il y en a
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        });

        // Fonction globale pour zoomer depuis le tableau
        window.focusOn = function(lat, lon) {
            if (map) {
                map.setView([lat, lon], 16);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
    </script>
</body>
</html>
