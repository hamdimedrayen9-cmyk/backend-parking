<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mes Véhicules – ParkManager</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-icon">🅿️</div>
            <div><h2>ParkManager</h2><small>Espace Client</small></div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/client/dashboard}">
                <span class="nav-icon">
                    <img th:src="@{/images/accueil.png}" alt="Accueil" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Accueil
            </a>
            <a th:href="@{/client/carte}">
                <span class="nav-icon">
                    <img th:src="@{/images/emplacement.png}" alt="Carte" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Carte des parkings
            </a>
            <a th:href="@{/client/reserver}">
                    <span class="nav-icon">
                        <img th:src="@{/images/ajouter.png}" alt="Ajouter" style="width: 18px; height: 18px; vertical-align: middle;">
                    </span> 
                    Réserver une place
                </a>
            <a th:href="@{/client/reservations}">
                <span class="nav-icon">
                    <img th:src="@{/images/programme.png}" alt="Reservations" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Mes réservations
            </a>
            <a th:href="@{/client/vehicules}" class="active">
                <span class="nav-icon">
                    <img th:src="@{/images/auto.png}" alt="Vehicules" style="width: 18px; height: 18px; vertical-align: middle;">
                </span> 
                Mes véhicules
            </a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <img th:src="@{/images/se-deconnecter.png}" alt="Déconnexion" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;">
                Déconnexion
            </a>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar">
            <h1>
                <img th:src="@{/images/auto.png}" alt="Car" style="width: 40px; height: 40px; vertical-align: middle;">
                Mes Véhicules
            </h1>
            <button onclick="document.getElementById('modalVehicule').classList.add('active')" class="btn btn-primary">
                <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                Ajouter un véhicule
            </button>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Immatriculation</th><th>Marque</th><th>Modèle</th><th>Type</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="v : ${vehicules}">
                                <td><strong th:text="${v.immatriculation}"></strong></td>
                                <td th:text="${v.marque}"></td>
                                <td th:text="${v.modele}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${v.type == 'VOITURE' ? 'badge-info' :
                                                           v.type == 'MOTO' ? 'badge-warning' :
                                                           v.type == 'CAMION' ? 'badge-danger' : 'badge-success'}"
                                          th:text="${v.type}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/client/vehicules/supprimer/{id}(id=${v.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Supprimer ce véhicule ?')">
                                        <img th:src="@{/images/supprimer.png}" alt="🗑️" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 5px; filter: brightness(0) invert(1);">
                                        Supprimer
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(vehicules)}">
                                <td colspan="5">
                                    <div class="empty-state">
                                        <div class="empty-icon">
                                            <img th:src="@{/images/auto.png}" alt="Empty car" style="width: 48px; height: 48px; opacity: 0.5;">
                                        </div>
                                        <p>Aucun véhicule enregistré</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modalVehicule">
    <div class="modal">
        <div class="modal-header">
                <h3>
                     <img th:src="@{/images/auto.png}" alt="Car" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 8px;">
                     Ajouter un véhicule
                 </h3>
                <button class="modal-close" onclick="document.getElementById('modalVehicule').classList.remove('active')">&times;</button>
            </div>
        <form th:action="@{/client/vehicules/ajouter}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Immatriculation *</label>
                    <input type="text" name="immatriculation" class="form-control" placeholder="Ex: 123TU456" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Type *</label>
                    <select name="type" class="form-control" required>
                        <option value="VOITURE">Voiture</option>
                        <option value="MOTO">Moto</option>
                        <option value="CAMION">Camion</option>
                        <option value="VAN">Van</option>
                    </select>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Marque</label>
                    <input type="text" name="marque" class="form-control" placeholder="Ex: Toyota">
                </div>
                <div class="form-group">
                    <label class="form-label">Modèle</label>
                    <input type="text" name="modele" class="form-control" placeholder="Ex: Corolla">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <img th:src="@{/images/ajouter.png}" alt="+" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; filter: brightness(0) invert(1);">
                    Ajouter
                </button>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalVehicule').classList.remove('active')">Annuler</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
