<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement – ParkManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .payment-card {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
        }
        .card-details {
            margin-top: 1.5rem;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        .form-row .form-group {
            flex: 1;
        }
        .reservation-summary {
            background: rgba(251, 191, 36, 0.05);
            padding: 1.25rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            border: 1px dashed var(--primary);
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .summary-item strong {
            color: var(--text);
        }
        .total-amount {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            border-top: 1px solid var(--border);
            margin-top: 0.75rem;
            padding-top: 0.75rem;
        }
        .card-visual {
            background: linear-gradient(135deg, #171717 0%, #0a0a0a 100%);
            height: 200px;
            border-radius: 24px;
            padding: 2rem;
            color: white;
            position: relative;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-neon-lg);
            border: 1px solid var(--border-glow);
            overflow: hidden;
        }
        .card-visual::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            opacity: 0.1;
        }
        .card-visual .chip {
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            border-radius: 8px;
            margin-bottom: 2rem;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .card-number-display {
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-family: monospace;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <main class="main-content" style="margin-left: 0; width: 100%;">
        <div class="topbar">
            <h1>💳 Paiement Sécurisé</h1>
            <a th:href="@{/client/reservations}" class="btn btn-secondary btn-sm">Retour</a>
        </div>

        <div class="page-body">
            <div class="payment-card">
                <div class="reservation-summary">
                    <h3 style="margin-bottom: 1rem;">Résumé de la réservation</h3>
                    <div class="summary-item">
                        <span>Parking:</span>
                        <strong th:text="${reservation.place.parking.nom}"></strong>
                    </div>
                    <div class="summary-item">
                        <span>Place:</span>
                        <strong th:text="'N°' + ${reservation.place.numero}"></strong>
                    </div>
                    <div class="summary-item">
                        <span>Véhicule:</span>
                        <strong th:text="${reservation.vehicule.immatriculation}"></strong>
                    </div>
                    <div class="total-amount summary-item">
                        <span>Montant à régler:</span>
                        <span th:text="${#numbers.formatDecimal(reservation.paiement.montant, 1, 2) + ' DT'}"></span>
                    </div>
                </div>

                <div class="card-visual">
                    <div class="chip"></div>
                    <div class="card-number-display" id="cardNumberDisplay">•••• •••• •••• ••••</div>
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <div style="font-size: 0.7rem; text-transform: uppercase; opacity: 0.8;">Titulaire</div>
                            <div style="font-size: 0.9rem;" th:text="${reservation.client.nom}"></div>
                        </div>
                        <div>
                            <div style="font-size: 0.7rem; text-transform: uppercase; opacity: 0.8;">Expire</div>
                            <div style="font-size: 0.9rem;" id="expiryDisplay">MM/YY</div>
                        </div>
                    </div>
                </div>

                <form id="paymentForm" class="auth-form">
                    <input type="hidden" id="reservationId" th:value="${reservation.id}">
                    
                    <div class="form-group">
                        <label class="form-label">Numéro de carte</label>
                        <input type="text" id="cardNumber" class="form-control" placeholder="4242 4242 4242 4242" required maxlength="16">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Date d'expiration</label>
                            <input type="text" id="expiryDate" class="form-control" placeholder="MM/YY" required maxlength="5">
                        </div>
                        <div class="form-group">
                            <label class="form-label">CVC</label>
                            <input type="text" id="cvc" class="form-control" placeholder="123" required maxlength="3">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-full" style="margin-top: 2rem;" id="payBtn">
                        <span class="btn-text">Confirmer le paiement</span>
                        <div class="spinner"></div>
                    </button>
                </form>

                <div id="paymentResult" style="display: none; margin-top: 1.5rem;" class="alert"></div>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    const paymentForm = document.getElementById('paymentForm');
    const payBtn = document.getElementById('payBtn');
    const cardNumberInput = document.getElementById('cardNumber');
    const expiryInput = document.getElementById('expiryDate');
    const cardNumberDisplay = document.getElementById('cardNumberDisplay');
    const expiryDisplay = document.getElementById('expiryDisplay');

    cardNumberInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        cardNumberDisplay.textContent = val.padEnd(16, '•').replace(/(.{4})/g, '$1 ').trim();
    });

    expiryInput.addEventListener('input', (e) => {
        let val = e.target.value;
        if (val.length === 2 && !val.includes('/')) {
            e.target.value = val + '/';
        }
        expiryDisplay.textContent = e.target.value || 'MM/YY';
    });

    paymentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        payBtn.classList.add('loading');
        payBtn.disabled = true;

        const payload = {
            reservationId: document.getElementById('reservationId').value,
            cardNumber: cardNumberInput.value,
            expiryDate: expiryInput.value,
            cvc: document.getElementById('cvc').value
        };

        try {
            const response = await fetch('/api/payment/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            const resultDiv = document.getElementById('paymentResult');
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'alert alert-success';
                resultDiv.textContent = '✅ ' + result.message + ' Redirection...';
                setTimeout(() => {
                    window.location.href = '/client/reservations?success=true';
                }, 2000);
            } else {
                resultDiv.className = 'alert alert-danger';
                resultDiv.textContent = '❌ ' + result.message;
                payBtn.classList.remove('loading');
                payBtn.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            const resultDiv = document.getElementById('paymentResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'alert alert-danger';
            resultDiv.textContent = '❌ Une erreur technique est survenue.';
            payBtn.classList.remove('loading');
            payBtn.disabled = false;
        }
    });
</script>
</body>
</html>
